<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberar nota | {{EMPRESA}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marinho:#0F3D3A; --azul:#0F766E; --laranja:#0F766E; --laranja-esc:#0B5A54;
    --amarelo:#5EEAD4; --fundo:#EEF3FA; --linha:#C9D6EA; --texto:#1B2440;
    --suave:#5B6787; --erro:#B42318; --erro-bg:#FDEDEB; --ok:#137A3F; --ok-bg:#E8F6EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;color:var(--texto);background:var(--fundo);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       padding:0 1rem 3rem}
  /* faixa da fachada: marinho com filete amarelo, como a placa das lojas */
  .faixa{position:fixed;inset:0 0 auto 0;height:220px;background:var(--marinho);
         border-bottom:6px solid var(--amarelo);z-index:0}
  .cartao{position:relative;z-index:1;width:100%;max-width:600px;margin-top:64px;
          background:#fff;border-radius:18px;padding:2rem 2.25rem 1.75rem;
          box-shadow:0 18px 40px -18px rgba(18,35,122,.45)}
  .marca{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.6rem;color:var(--marinho);
         margin-bottom:1.4rem;line-height:1.1}
  .marca span{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:.9rem;color:var(--suave)}
  .logo{display:block;width:230px;max-width:70%;height:auto;margin:0 0 1.6rem -6px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2.35rem;
     line-height:1;color:var(--marinho);letter-spacing:.2px}
  .sub{margin:.55rem 0 1.6rem;color:var(--suave);font-size:1rem;line-height:1.45;max-width:42ch}
  label{display:block;font-weight:600;font-size:.95rem;margin-bottom:.45rem}
  label span{font-weight:400;color:var(--suave)}
  .campo{position:relative}
  input{width:100%;font-family:'Barlow',sans-serif;font-size:1.06rem;font-weight:600;
        font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--marinho);
        border:2px solid var(--linha);border-radius:12px;padding:.85rem 2.8rem .85rem 1rem;
        background:#fff;outline:none;transition:border-color .15s}
  input::placeholder{color:#AEB9CF;font-weight:500}
  input:focus{border-color:var(--azul);box-shadow:0 0 0 4px rgba(10,107,192,.15)}
  .limpar{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);border:0;
          background:none;color:var(--suave);font-size:1.25rem;line-height:1;cursor:pointer;
          padding:.35rem;border-radius:8px;display:none}
  .limpar:hover{color:var(--marinho);background:var(--fundo)}
  .limpar.ver{display:block}
  /* 11 blocos de 4 digitos, no mesmo agrupamento do DANFE */
  .blocos{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:.7rem 0 .4rem}
  .bloco{height:7px;border-radius:4px;background:#E2E9F4;overflow:hidden;position:relative}
  .bloco i{position:absolute;inset:0;width:0;background:var(--laranja);transition:width .12s}
  .completo .bloco i{background:var(--azul)}
  .contador{font-size:.88rem;color:var(--suave);text-align:right;margin-bottom:1.3rem;
            font-variant-numeric:tabular-nums}
  .completo + .contador{color:var(--azul);font-weight:600}
  button.baixar{width:100%;border:0;border-radius:12px;background:var(--laranja);color:#fff;
        font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:700;
        letter-spacing:.3px;padding:.8rem;cursor:pointer;display:flex;align-items:center;
        justify-content:center;gap:.6rem;transition:background .15s, transform .05s}
  button.baixar:hover:not(:disabled){background:var(--laranja-esc)}
  button.baixar:active:not(:disabled){transform:translateY(1px)}
  button.baixar:disabled{background:#D5DDEA;color:#8592AD;cursor:not-allowed}
  button:focus-visible,.item:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
  .gira{width:18px;height:18px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;
        border-radius:50%;animation:gira .7s linear infinite;display:none}
  @keyframes gira{to{transform:rotate(360deg)}}
  .aviso{display:none;margin-top:1rem;padding:.85rem 1rem;border-radius:12px;font-size:.98rem;line-height:1.45}
  .aviso.erro{display:block;background:var(--erro-bg);color:var(--erro)}
  .aviso.ok{display:block;background:var(--ok-bg);color:var(--ok)}
  .aviso.info{display:block;background:#EAF2FB;color:var(--marinho)}
  .aviso b{font-weight:700}
  .aviso small{display:block;margin-top:.2rem;color:inherit;opacity:.85;word-break:break-all}
  .confirmar{display:block;margin-top:.75rem;width:100%;border:2px solid var(--marinho);background:#fff;
        color:var(--marinho);font:600 1rem 'Barlow',sans-serif;padding:.6rem;border-radius:10px;cursor:pointer}
  .confirmar:hover:not(:disabled){background:var(--marinho);color:#fff}
  .confirmar:disabled{opacity:.6;cursor:wait}
  .historico{margin-top:1.5rem;display:none}
  .historico h2{font-size:.95rem;font-weight:600;margin-bottom:.4rem}
  .item{display:flex;justify-content:space-between;gap:1rem;width:100%;border:0;background:none;
        text-align:left;font:inherit;font-variant-numeric:tabular-nums;color:var(--texto);
        padding:.55rem .6rem;border-radius:8px;cursor:pointer}
  .item:hover{background:var(--fundo)}
  .item span:last-child{color:var(--suave);font-size:.88rem}
  .rodape{margin-top:1.4rem;padding-top:1rem;border-top:1px solid #E6ECF5;font-size:.88rem;
          color:var(--suave)}
  @media (max-width:480px){
    .cartao{padding:1.5rem 1.25rem 1.25rem;margin-top:40px}
    h1{font-size:2rem} input{font-size:.9rem;padding-left:.75rem}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<div class="faixa" aria-hidden="true"></div>

<main class="cartao">
  <p class="marca">{{EMPRESA}}<span>{{SUBTITULO}}</span></p>

  <h1>Liberar nota fiscal</h1>
  <p class="sub">Cole a chave de acesso do DANFE para baixar o XML e importar no sistema.</p>

  <label for="chave">Chave de acesso <span>(44 dígitos)</span></label>
  <div class="campo">
    <input id="chave" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
           maxlength="54" placeholder="Cole aqui a chave de acesso">
    <button class="limpar" id="limpar" type="button" aria-label="Limpar chave">&times;</button>
  </div>
  <div class="blocos" id="blocos" aria-hidden="true"></div>
  <div class="contador" id="contador">0 de 44 dígitos</div>

  <button class="baixar" id="baixar" type="button" disabled>
    <span id="rotulo">Baixar XML</span><span class="gira" id="gira"></span>
  </button>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <section class="historico" id="historico">
    <h2>Notas desta sessão</h2>
    <div id="lista"></div>
  </section>

  <p class="rodape" id="rodape">Dúvidas na liberação, fale com a gerência.</p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const input=$("chave"), botao=$("baixar"), rotulo=$("rotulo"), gira=$("gira"),
        aviso=$("aviso"), blocos=$("blocos"), contador=$("contador"), limpar=$("limpar");

  for (let i=0;i<11;i++){ const b=document.createElement("div"); b.className="bloco";
    b.appendChild(document.createElement("i")); blocos.appendChild(b); }
  const barras=[...blocos.querySelectorAll("i")];

  const digitos = () => input.value.replace(/\D/g,"");
  const formatar = d => (d.match(/.{1,4}/g)||[]).join(" ");

  function atualizar(){
    const n=digitos().length;
    barras.forEach((b,i)=>{ b.style.width = Math.max(0,Math.min(4,n-i*4))/4*100+"%"; });
    blocos.classList.toggle("completo", n===44);
    contador.textContent = n===44 ? "Chave completa" : n+" de 44 dígitos";
    limpar.classList.toggle("ver", n>0);
    botao.disabled = n!==44;
  }
  function mostrar(tipo, html){ aviso.className="aviso "+tipo; aviso.innerHTML=html; }
  function esconder(){ aviso.className="aviso"; aviso.innerHTML=""; }

  input.addEventListener("input",()=>{ input.value=formatar(digitos().slice(0,44)); esconder(); atualizar(); });
  input.addEventListener("keydown",e=>{ if(e.key==="Enter" && !botao.disabled) botao.click(); });
  limpar.addEventListener("click",()=>{ input.value=""; input.focus(); esconder(); atualizar(); });

  function registrar(chave){
    $("historico").style.display="block";
    const b=document.createElement("button"); b.type="button"; b.className="item";
    const hora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    b.innerHTML="<span>"+chave.slice(0,8)+"…"+chave.slice(-8)+"</span><span>"+hora+"</span>";
    b.title=chave;
    b.onclick=()=>{ input.value=formatar(chave); esconder(); atualizar(); input.focus(); };
    $("lista").prepend(b);
  }

  botao.addEventListener("click", async ()=>{
    const chave=digitos(); if(chave.length!==44) return;
    esconder(); botao.disabled=true; gira.style.display="inline-block";
    rotulo.textContent="Consultando a SEFAZ…";
    const lento=setTimeout(()=>mostrar("info",
      "A primeira consulta do dia pode levar até 1 minuto enquanto o sistema inicia. Aguarde nesta tela."),8000);
    try{
      const r=await fetch("/consultar",{method:"POST",headers:{"Content-Type":"application/json"},
                                         body:JSON.stringify({chave})});
      clearTimeout(lento);
      if(!r.ok){
        const e=await r.json().catch(()=>({erro:"Não foi possível concluir a consulta."}));
        if(e.acao==="confirmar"){ oferecerConfirmacao(chave, e.erro); return; }
        mostrar("erro","<b>Nota não liberada.</b> "+e.erro); return;
      }
      await salvar(r, chave);
    }catch(_){
      clearTimeout(lento);
      mostrar("erro","<b>Sem conexão com o servidor.</b> Verifique a internet e tente novamente.");
    }finally{
      gira.style.display="none"; rotulo.textContent="Baixar XML"; atualizar();
    }
  });

  async function salvar(r, chave){
    const blob=await r.blob(), url=URL.createObjectURL(blob), a=document.createElement("a");
    const nome="NF-e_"+chave+".xml"; a.href=url; a.download=nome; a.click(); URL.revokeObjectURL(url);
    mostrar("ok","<b>XML baixado.</b> Agora é só importar no sistema.<small>"+nome+"</small>");
    registrar(chave);
  }

  function oferecerConfirmacao(chave, texto){
    mostrar("info", "<b>Nota com mais de 10 dias.</b> "+texto+
      '<button type="button" class="confirmar" id="btnConfirmar">Confirmar recebimento e baixar XML</button>');
    $("btnConfirmar").onclick = () => confirmarRecebimento(chave);
  }

  async function confirmarRecebimento(chave){
    const ok = confirm("Confirmar o recebimento desta nota?\n\n"+
      "Isso registra na SEFAZ, em nome da empresa, que a mercadoria foi recebida conforme a nota. "+
      "Depois de confirmado, não é possível desfazer.\n\n"+
      "Só confirme se a mercadoria chegou e confere com a nota.");
    if(!ok) return;
    const b=$("btnConfirmar"); b.disabled=true; b.textContent="Confirmando na SEFAZ…";
    try{
      const r=await fetch("/confirmar",{method:"POST",headers:{"Content-Type":"application/json"},
                                         body:JSON.stringify({chave})});
      if(!r.ok){
        const e=await r.json().catch(()=>({erro:"Não foi possível confirmar."}));
        mostrar("erro","<b>Não confirmado.</b> "+e.erro); return;
      }
      await salvar(r, chave);
    }catch(_){
      mostrar("erro","<b>Sem conexão com o servidor.</b> Verifique a internet e tente novamente.");
    }
  }
  atualizar();
</script>
</body>
</html>
